<!DOCTYPE html>
<html>
<head>
<title>Mitems</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/Images/Favicon Mitems.png"> 
<style>
@import url('https://fonts.cdnfonts.com/css/minecraft-4');

body {
      
background-image: url('Minecraft.gif'); 
            
            
background-repeat: no-repeat; 
            
            
background-position: center; 
            
           
background-size: cover; 
            
          
background-attachment: fixed; 
            
           
min-height: 100vh; 

margin: 0;

}

.topnav {
  overflow: hidden;
  background-color: lightgrey;
}


</style>
<link rel="stylesheet" href="style2.css">
<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
             

</head>


<body>
 <div class="topnav">
 <a class="active" href="index.html">Home</a> 
 <a href="shop.html">Shop</a>
 <a href="credits.html">Credits</a>
 </div>
<div id="loading-screen">
<img src="Rainbow.gif" alt="Loading...">
<div class="overlay-image" src="Images/LogoREALFR.png">Baka</div>
<div class="overlay-text">MITEMS: THE SHOP</div>

</div>
<img src="Images/LogoREALFR.png" alt="Mitems Logo" style="width: 250px; height: auto;">

<h2>Order</h2>

<form id="orderForm">

<label for="item">Choose an Item</label>
<select id="item" required>
<option value="Wither Skeleton Skull" data-price="250">Wither Skeleton Skull - $250</option>
<option value="Nether Star" data-price="1000">Nether Star - $1000</option>
<option value="Beacon" data-price="2000">Beacon - $2000</option>
</select>

<br><br>

<label for="quantity">Quantity</label>
<input type="number" id="quantity" min="1" value="1" required>

<br><br>

<button type="submit">Place Order</button>
</form>

<h3 id="total">Total: $50</h3>
<div id="orders"></div>

<script src="script2.js"></script>

<div id="orders"></div>

<script>
const itemSelect = document.getElementById("item");
const quantityInput = document.getElementById("quantity");
const totalText = document.getElementById("total");
const orderForm = document.getElementById("orderForm");
const ordersDiv = document.getElementById("orders");

function updateTotal() {
    const price = parseInt(
        itemSelect.options[itemSelect.selectedIndex].dataset.price
    );

    const quantity = parseInt(quantityInput.value);

    totalText.textContent = `Total: $${price * quantity}`;
}

itemSelect.addEventListener("change", updateTotal);
quantityInput.addEventListener("input", updateTotal);

orderForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const item = itemSelect.value;
    const quantity = quantityInput.value;

    const price = parseInt(
        itemSelect.options[itemSelect.selectedIndex].dataset.price
    );

    const total = price * quantity;

    ordersDiv.innerHTML += `
        <div style="background:white;padding:10px;margin:10px 0;border:2px solid black;">
            <strong>Order Placed!</strong><br>
            Item: ${item}<br>
            Quantity: ${quantity}<br>
            Total: $${total}
        </div>
    `;
});

updateTotal();
</script>

</body>
</html>
